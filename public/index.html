<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AudioHub Auth</title>
    <link rel="stylesheet" href="./style/style.css" />
  </head>
  <body>
    <main>
      <section>
        <h1>Register</h1>
        <form id="register-form">
          <label for="register-name">Name</label>
          <input
            type="text"
            id="register-name"
            name="name"
            autocomplete="name"
            required
          />

          <label for="register-email">Email</label>
          <input
            type="email"
            id="register-email"
            name="email"
            autocomplete="email"
            required
          />

          <label for="register-password">Password</label>
          <input
            type="password"
            id="register-password"
            name="password"
            autocomplete="new-password"
            required
          />

          <button type="submit">Register</button>
        </form>
      </section>

      <section>
        <h1>Login</h1>
        <form id="login-form">
          <label for="login-email">Email</label>
          <input
            type="email"
            id="login-email"
            name="email"
            autocomplete="email"
            required
          />

          <label for="login-password">Password</label>
          <input
            type="password"
            id="login-password"
            name="password"
            autocomplete="current-password"
            required
          />

          <button type="submit">Login</button>
        </form>
      </section>

      <section>
        <h1>YouTube Video Search</h1>
        <form id="youtube-search-form">
          <label for="youtube-title">YouTube title</label>
          <input
            type="text"
            id="youtube-title"
            name="ytTiltle"
            autocomplete="off"
            required
          />

          <button type="submit">Search</button>
        </form>
        <!-- aria-live="polite" -> Indicates that an element will be updated -->
        <div id="youtube-results" aria-live="polite"></div>
      </section>
    </main>

    <script src="./js/api.js"></script>
    <script src="./js/main.js"></script>
  </body>
</html>
