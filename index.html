<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/audiohub/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AudioHub</title>
    <script>
      (() => {
        const storageKey = 'audiohub.theme'
        let theme = 'light'

        try {
          const storedTheme = window.localStorage.getItem(storageKey)
          if (storedTheme === 'dark') {
            theme = 'dark'
          }
        } catch {
          theme = 'light'
        }

        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light'
      })()
    </script>
    <script type="module" crossorigin src="/audiohub/assets/index-DEUXUjIs.js"></script>
    <link rel="stylesheet" crossorigin href="/audiohub/assets/index-DXPkiVLG.css">
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
